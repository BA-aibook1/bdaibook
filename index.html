        if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\\.0$/, '') + 'K';

                    <button onclick="requestPasswordOtp()" class="btn-orange" style="padding:8px;">Send OTP Code</button>
                    
                    <div id="otp-verify-section" class="hidden" style="margin-top:8px;">
                        <input type="text" id="forgot-otp" placeholder="6-digit OTP code">
                        <input type="password" id="new-password" placeholder="New Password">
                        <button onclick="submitNewPassword()" class="btn-green" style="padding:8px;">Update Password</button>
                    </div>
                </div>
            \`;
        }
    }

    function switchAuthTab(tab) {
        document.getElementById('auth-login-box').classList.add('hidden');
        document.getElementById('auth-signup-box').classList.add('hidden');
        document.getElementById('auth-forgot-box').classList.add('hidden');

        if(tab === 'login') document.getElementById('auth-login-box').classList.remove('hidden');
        else if(tab === 'signup') document.getElementById('auth-signup-box').classList.remove('hidden');
        else if(tab === 'forgot') document.getElementById('auth-forgot-box').classList.remove('hidden');
    }

    async function requestPasswordOtp() {
        const email = document.getElementById('forgot-email').value;
        if(!email) { alert('Enter your email first!'); return; }
        const res = await fetch('/api/auth/forgot', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email }) });
        const data = await res.json();
        if(data.success) {
            alert('OTP Generated! (Demo Code: ' + data.otp + ')');
            document.getElementById('otp-verify-section').classList.remove('hidden');
        } else {
            alert(data.message);
        }
    }

    async function submitNewPassword() {
        const email = document.getElementById('forgot-email').value;
        const otp = document.getElementById('forgot-otp').value;
        const newPassword = document.getElementById('new-password').value;
        if(!otp || !newPassword) { alert('Enter OTP and new password!'); return; }

        const res = await fetch('/api/auth/reset-password', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, otp, newPassword }) });
        const data = await res.json();
        if(data.success) {
            alert('Password reset successful! Please log in.');
            switchAuthTab('login');
        } else {
            alert(data.message);
        }
    }

    async function registerUser() {
        const name = document.getElementById('reg-name').value, email = document.getElementById('reg-email').value, password = document.getElementById('reg-password').value;
        if(!name || !email || !password) { alert('Fill all fields!'); return; }
        const res = await fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, email, password }) });
        const data = await res.json();
        if(data.success) { localStorage.setItem('bdaibook_user', JSON.stringify(data.user)); alert('Registered!'); toggleMenu(); loadFeed(); } else { alert(data.message); }
    }

    async function loginUser() {
        const email = document.getElementById('login-email').value, password = document.getElementById('login-password').value;
        const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if(data.success) { localStorage.setItem('bdaibook_user', JSON.stringify(data.user)); alert('Login successful!'); toggleMenu(); loadFeed(); } else { alert(data.message); }
    }

    function logoutUser() { localStorage.removeItem('bdaibook_user'); alert('Logged out.'); toggleMenu(); loadFeed(); }

    async function applyForBlueTick() {
        const fullname = document.getElementById('orig-fullname').value;
        const phone = document.getElementById('orig-phone').value;
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!fullname || !phone) { alert('Please enter name and wallet/phone!'); return; }
        
        const res = await fetch('/api/user/apply-bluetick', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: savedUser.email, name: fullname, walletInfo: phone })
        });

        if(data.success) {
            savedUser.name = data.user.name;
            savedUser.walletInfo = data.user.walletInfo;
            savedUser.verified = data.user.verified;
            localStorage.setItem('bdaibook_user', JSON.stringify(savedUser));
            alert('Submitted successfully! Blue Tick verified 🔵');
            toggleMenu();
            loadFeed();
        } else {
            alert(data.message);
        }

    async function requestPayout() {
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        const res = await fetch('/api/user/payout-request', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: savedUser.email })
        });
        const data = await res.json();
        alert(data.message);
    }

    async function uploadUserAvatar() {
        const fileInput = document.getElementById('user-avatar-input'), savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!fileInput.files.length) { alert('Select image'); return; }

        const data = await res.json();
        if(data.success) { savedUser.avatar = data.avatar; localStorage.setItem('bdaibook_user', JSON.stringify(savedUser)); alert(data.message); toggleMenu(); loadFeed(); } else { alert(data.message); }

    async function publishTextPost() {
        const content = document.getElementById('text-post-content').value, savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!savedUser.email) { alert('Please login first!'); return; }
        if(!content.trim()) { alert('Write something!'); return; }
        
        const res = await fetch('/api/upload', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: content, type: 'text', userEmail: savedUser.email })
        });
        const data = await res.json();
        if(data.success) {
            alert('Post published!');
            toggleMenu();
            loadFeed();
        } else {
            alert('Failed: ' + (data.message || 'Error'));
        }

        const customAdCode = document.getElementById('admin-custom-ad').value;

    async function adminAction(action, email) {
        const res = await fetch('/api/admin/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action, email }) });
        const data = await res.json();
        if(data.success) { allUsersData = data.users; alert('Done!'); renderMenuContent(); loadFeed(); }
    }

    function uploadContentDirect() {
        const title = document.getElementById('upload-title').value, type = document.getElementById('upload-type').value;
        const fileInput = document.getElementById('upload-file'), savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!savedUser.email) { alert('Please login first!'); return; }
        if(!fileInput.files.length) { alert('Select media file!'); return; }
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]); 
        formData.append('title', title); 
        formData.append('type', type); 
        formData.append('userEmail', savedUser.email);
        
        const progContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('upload-status-text');
        const publishBtn = document.getElementById('publish-btn');

        progContainer.style.display = 'block';
        publishBtn.disabled = true;
        publishBtn.style.opacity = '0.6';

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload', true);

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percentComplete + '%';
                progressBar.innerText = percentComplete + '%';
                statusText.innerText = \`Uploading... \${percentComplete}%\`;
            }
        };

        xhr.onload = () => {
            publishBtn.disabled = false;
            publishBtn.style.opacity = '1';
            if(xhr.status === 200) {
                try {
                    const data = JSON.parse(xhr.responseText);
                    if(data.success) {
                        statusText.innerText = 'Upload Successful! 🎉';
                        alert('Media uploaded directly to R2!');
                        toggleMenu();
                        loadFeed();
                    } else {
                        statusText.innerText = 'Failed!';
                        alert('Failed: ' + data.message);
                    }
                } catch(e) {
                    statusText.innerText = 'Success!';
                    alert('Uploaded to R2!');
                    toggleMenu();
                    loadFeed();
                }
            } else {
                statusText.innerText = 'Failed!';
                alert('Upload failed.');
            }
        };

        xhr.onerror = () => {
            publishBtn.disabled = false;
            publishBtn.style.opacity = '1';
            statusText.innerText = 'Network Error!';
            alert('Network error.');
        };

        xhr.send(formData);
    }

    async function loadFeed() {
        try {
            const res = await fetch('/api/feed'); 
            const data = await res.json();
            if(data.success) { 
                allMediaData = data.media; 
                allUsersData = data.users; 
                globalSettings = data.settings; 
                if(document.getElementById('header-logo')) {
                    document.getElementById('header-logo').src = globalSettings.headerLogo; 
                }
                renderFilteredFeed(); 
            }
        } catch(e) {
            document.getElementById('feed-container').innerHTML = '<p style="text-align:center; padding:20px; color:#dc3545;">Failed to load feed.</p>';
        }
    }

    function filterFeed(type, btn) { currentFilter = type; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderFilteredFeed(); }
    function handleSearch(q) { searchQuery = q.toLowerCase(); renderFilteredFeed(); }

    async function toggleLike(mediaId) {
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!savedUser.email) { alert('Please log in!'); return; }
        await fetch('/api/media/like', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mediaId, userEmail: savedUser.email }) });
        loadFeed();
    }

    async function addComment(mediaId) {
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!savedUser.email) { alert('Please log in!'); return; }
        const inputField = document.getElementById(\`comment-input-\${mediaId}\`);
        const commentText = inputField.value.trim();
        if(!commentText) return;

        const res = await fetch('/api/media/comment', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ mediaId, userEmail: savedUser.email, text: commentText })
        });
        const data = await res.json();
        if(data.success) {
            inputField.value = '';
            loadFeed();
        } else {
            alert(data.message || 'Failed.');
        }
    }

    async function deleteMediaPost(mediaId) {
        if(!confirm('Delete this post?')) return;
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        const res = await fetch('/api/media/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mediaId, userEmail: savedUser.email }) });
        const data = await res.json();
        if(data.success) { alert(data.message); loadFeed(); } else { alert(data.message || 'Failed'); }
    }

    async function toggleFollow(authorEmail, btn) {
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        if(!savedUser.email) { alert('Please log in!'); return; }
        const res = await fetch('/api/user/follow', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ followerEmail: savedUser.email, targetEmail: authorEmail }) });
        const data = await res.json();
        if(data.success) { btn.classList.toggle('following', data.isFollowing); btn.innerText = data.isFollowing ? '✓ Following' : '+ Follow'; loadFeed(); }
    }

    function openShareModal(url, title) {
        const siteUrl = window.location.origin;
        const shareUrl = url && url.startsWith('http') ? url : siteUrl;
        const encUrl = encodeURIComponent(shareUrl);
        const encTitle = encodeURIComponent('BDAIBOOK 1 - ' + title);

        document.getElementById('og-title').setAttribute('content', title);
        document.getElementById('og-image').setAttribute('content', url && url.startsWith('http') ? url : siteUrl + '/bd-ai-book-logo.jpg');

        document.getElementById('share-buttons-container').innerHTML = \`
            <a href="https://www.facebook.com/sharer/sharer.php?u=\${encUrl}&quote=\${encTitle}" target="_blank" style="padding:8px; background:#1877f2; color:#fff; border-radius:6px; font-weight:bold; text-decoration:none; text-align:center;">📘 Facebook</a>
            <a href="https://t.me/share/url?url=\${encUrl}&text=\${encTitle}" target="_blank" style="padding:8px; background:#229ed9; color:#fff; border-radius:6px; font-weight:bold; text-decoration:none; text-align:center;">✈️ Telegram</a>
            <a href="https://api.whatsapp.com/send?text=\${encTitle}%20\${encUrl}" target="_blank" style="padding:8px; background:#25d366; color:#fff; border-radius:6px; font-weight:bold; text-decoration:none; text-align:center;">💬 WhatsApp</a>
            <button onclick="navigator.clipboard.writeText('\${shareUrl}'); alert('Copied!'); closeShareModal();" style="padding:8px; background:#6c757d; color:#fff; border-radius:6px; font-weight:bold;">📋 Copy Link</button>
        \`;
        document.getElementById('share-modal').classList.remove('hidden');
    }
    function closeShareModal() { document.getElementById('share-modal').classList.add('hidden'); }

    function renderFilteredFeed() {
        let filtered = currentFilter === 'all' ? allMediaData : allMediaData.filter(i => (currentFilter === 'text' ? i.type === 'text' : i.type === currentFilter));
        filtered = filtered.filter(i => i.paymentStatus === 'Approved');
        if(searchQuery) { filtered = filtered.filter(i => i.title.toLowerCase().includes(searchQuery) || i.authorName.toLowerCase().includes(searchQuery)); }

        if(!filtered.length) { document.getElementById('feed-container').innerHTML = '<p style="text-align:center; padding:20px;">No content found.</p>'; return; }
        
        const savedUser = JSON.parse(localStorage.getItem('bdaibook_user') || '{}');
        
        let adsenseBox = '';
        if (globalSettings.adsenseVerified) {
            adsenseBox += \`<div class="ad-banner">📢 Sponsored AdSense Ad: Monetize Your Content on BDAIBOOK 1</div>\`;
        }
        if (globalSettings.customAdCode && globalSettings.customAdCode.trim() !== '') {
            adsenseBox += \`<div class="ad-banner custom-ad-box" style="border-color:#1877f2; background:#111;">\${globalSettings.customAdCode}</div>\`;
        }

        let html = '';
        filtered.forEach(item => {
            let mediaEl = '';
            if (item.type === 'image') {
                mediaEl = \`<img src="\${item.mediaUrl}" style="width:100%; border-radius:6px; margin-top:6px;">\`;
            } else if (item.type === 'long' || item.type === 'short') {
                mediaEl = \`<video controls style="width:100%; border-radius:6px; margin-top:6px;" src="\${item.mediaUrl}"></video>\`;
            } else {
                mediaEl = ''; 
            }

            let isFollowing = item.followersList && item.followersList.includes(savedUser.email);
            let userLiked = item.likesList && item.likesList.includes(savedUser.email);
            let authorData = allUsersData[item.userEmail] || {};
            let realFollowersCount = formatNumber(authorData.followers || 0);
            let realViewsCount = formatNumber(item.views || 0);
            
            let canDelete = savedUser.isOwner || (savedUser.email && savedUser.email === item.userEmail);
            let deleteBtnHtml = canDelete ? \`<button class="delete-btn" onclick="deleteMediaPost('\${item.mediaId}')">🗑️ Delete Post</button>\` : '';

            let commentsHtml = '';
            if (item.comments && item.comments.length > 0) {
                item.comments.forEach(c => {
                    commentsHtml += \`<div class="comment-item"><b>\${c.authorName || 'User'}</b>: \${c.text}</div>\`;
                });
            } else {
                commentsHtml += \`<div style="font-size:12px; opacity:0.6; padding:2px 0;">No comments yet.</div>\`;
            }

            html += \`
                <div class="card">
                    <div class="feed-header">
                        <div class="author-info">
                            <img src="\${item.authorAvatar}" class="avatar">
                            <div><b>\${item.authorName}</b> \${authorData.verified ? '<span class="verified-badge"></span>' : ''}<br><small style="opacity:0.7;">Followers: \${realFollowersCount} | Views: \${realViewsCount}</small></div>
                        </div>
                        <button class="follow-btn \${isFollowing ? 'following' : ''}" onclick="toggleFollow('\${item.userEmail}', this)">\${isFollowing ? '✓ Following' : '+ Follow'}</button>
                    </div>
                    <p style="font-weight:bold; margin-bottom:4px; font-size:14px;">\${item.title}</p>
                    \${mediaEl}
                    \${adsenseBox}
                    <div class="action-bar">
                        <button class="action-btn" onclick="toggleLike('\${item.mediaId}')" style="color:\${userLiked ? '#1877f2' : 'inherit'};">👍 Like (\${formatNumber(item.likes || 0)})</button>
                        <button class="action-btn" onclick="document.getElementById('comment-section-\${item.mediaId}').classList.toggle('hidden')">💬 Comment (\${item.comments ? item.comments.length : 0})</button>
                        <button class="action-btn" onclick="openShareModal('\${item.mediaUrl || ''}', '\${item.title.replace(/'/g, "\\\\'")}')">↗️ Share</button>
                    </div>

                    <div id="comment-section-\${item.mediaId}" class="comments-section hidden">
                        <div style="max-height: 120px; overflow-y: auto;">\${commentsHtml}</div>
                        <div class="comment-box-input">
                            <input type="text" id="comment-input-\${item.mediaId}" placeholder="Write a comment...">
                            <button onclick="addComment('\${item.mediaId}')" class="btn-green">Post</button>
                        </div>
                    </div>

                    \${deleteBtnHtml}
                </div>
            \`;
        });
        document.getElementById('feed-container').innerHTML = html;
    }

    loadFeed();
</script>
</body>
</html>`;
